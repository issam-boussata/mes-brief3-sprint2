<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>YouCode Workshop</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="card">
      <header>
        <p class="brand">YouCode Workshop</p>
        <h1>Inscription à un atelier</h1>
        <p>Choisissez un atelier et votre mode de participation.</p>
      </header>

      <form id="inscription-form" novalidate>
        <fieldset class="champ">
          <legend>Votre atelier</legend>
          <!-- Insérer ici les clones de template-atelier pour les ateliers disponibles. -->
          <div id="liste-ateliers" class="choix"></div>
          <p id="erreur-atelier" class="erreur" aria-live="polite"></p>
        </fieldset>

        <fieldset class="champ">
          <legend>Mode de participation</legend>
          <!-- Insérer ici les clones de template-mode. -->
          <div id="liste-modes" class="choix choix-grille"></div>
          <p id="erreur-mode" class="erreur" aria-live="polite"></p>
        </fieldset>

        <fieldset id="champ-campus" class="champ" hidden disabled>
          <legend>Votre campus</legend>
          <!-- Insérer ici les clones de template-campus. Activer ce fieldset en présentiel. -->
          <div id="liste-campus" class="choix choix-grille"></div>
          <p id="erreur-campus" class="erreur" aria-live="polite"></p>
        </fieldset>

        <div id="champ-email" class="champ" hidden>
          <label for="email">Adresse e-mail</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            placeholder="exemple@domaine.com"
            disabled
            aria-describedby="erreur-email"
          />
          <p id="erreur-email" class="erreur" aria-live="polite"></p>
        </div>

        <button id="Confirmer" type="submit">Confirmer mon inscription</button>
      </form>

      <section id="recapitulatif" aria-labelledby="titre-recapitulatif" hidden>
        <h2 id="titre-recapitulatif">Récapitulatif de l’inscription</h2>
        <div id="recapitulatif-contenu" aria-live="polite"></div>
      </section>
    </main>

    <!-- Cloner template.content, compléter les valeurs et les textes, puis insérer le clone.
       Chaque label enveloppe son input. Les radios d'un groupe partagent le même name.
       Aucun id dans les templates afin d'éviter les doublons lors du clonage. -->
    <template id="template-atelier">
      <label class="carte-choix">
        <input
          type="radio"
          name="atelier"
          value=""
          required
          aria-describedby="erreur-atelier"
        />
        <span>
          <strong class="atelier-titre"></strong>
          <span class="atelier-places detail"></span>
        </span>
      </label>
    </template>

    <template id="template-mode">
      <label class="carte-choix">
        <input
          type="radio"
          name="mode"
          value=""
          required
          aria-describedby="erreur-mode"
        />
        <span class="mode-libelle"></span>
      </label>
    </template>

    <template id="template-campus">
      <label class="carte-choix">
        <input
          type="radio"
          name="campus"
          value=""
          required
          aria-describedby="erreur-campus"
        />
        <span class="campus-libelle"></span>
      </label>
    </template>

    <template id="template-recapitulatif">
      <dl class="recap-liste">
        <div>
          <dt>Atelier</dt>
          <dd class="recap-atelier"></dd>
        </div>
        <div>
          <dt>Participation</dt>
          <dd class="recap-mode"></dd>
        </div>
        <!-- Adapter le libellé à Campus ou Adresse e-mail selon le mode actif. -->
        <div>
          <dt class="recap-detail-libelle"></dt>
          <dd class="recap-detail-valeur"></dd>
        </div>
      </dl>
    </template>
  </body>
</html>
